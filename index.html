  <!-- =========================================================================
       MAIN CONTENT CONTAINER
       ========================================================================= -->
  <main class="main-container assessment-suite-wrapper">

    <!-- =========================================================================
         WEEK ASSESSMENT SELECTOR (WEEK 2 • PROPORTION vs WEEK 3 • SETS)
         ========================================================================= -->
    <div class="week-selector-hub" id="weekSelectorHub">
      <div class="week-selector-inner">
        <span class="week-hub-label"><i class="fa-solid fa-calendar-check"></i> اختر التقييم الأسبوعي:</span>
        <div class="week-pills-wrap">
          <button class="week-pill-btn" id="btnWeek2" onclick="AssessmentApp.switchWeek('week2')">
            <span class="week-badge">Week 2</span>
            <span>التناسب وتطبيقاته (Proportion)</span>
          </button>
          <button class="week-pill-btn" id="btnWeek3" onclick="AssessmentApp.switchWeek('week3')">
            <span class="week-badge">Week 3</span>
            <span>المجموعات (Sets & Operations)</span>
          </button>
          <button class="week-pill-btn" id="btnWeek4" onclick="AssessmentApp.switchWeek('week4')">
            <span class="week-badge">Week 4</span>
            <span>الأعداد الصحيحة (Integers & |z|)</span>
          </button>
          <button class="week-pill-btn active" id="btnWeek5" onclick="AssessmentApp.switchWeek('week5')">
            <span class="week-badge">Week 5</span>
            <span>الأعداد النسبية (Rational Numbers Q)</span>
            <span class="mini-tag">الجديد ✨</span>
          </button>
        </div>
      </div>
    </div>

    <!-- =========================================================================
         ASSESSMENT TOP CONTROLS & GROUP SWITCHER
         ========================================================================= -->
    <header class="assessment-nav-bar">
      <!-- Group Switcher (A, B, C) -->
      <div class="group-switcher-tabs" role="tablist" aria-label="Assessment Groups">
        <button class="group-tab-btn active" id="tabGroupA" onclick="AssessmentApp.switchGroup('groupA')">
          <i class="fa-solid fa-shapes"></i> Group (A)
        </button>
        <button class="group-tab-btn" id="tabGroupB" onclick="AssessmentApp.switchGroup('groupB')">
          <i class="fa-solid fa-calculator"></i> Group (B)
        </button>
        <button class="group-tab-btn" id="tabGroupC" onclick="AssessmentApp.switchGroup('groupC')">
          <i class="fa-solid fa-compass-drafting"></i> Group (C)
        </button>
      </div>

      <!-- Question Stepper (1 to 5) -->
      <div class="question-stepper-row" id="questionStepperRow">
        <button class="q-step-btn active" onclick="AssessmentApp.goToQuestion(0)" title="Question 1 (Choose)">1</button>
        <button class="q-step-btn" onclick="AssessmentApp.goToQuestion(1)" title="Question 2 (Choose)">2</button>
        <button class="q-step-btn" onclick="AssessmentApp.goToQuestion(2)" title="Question 3 (Problem)">3</button>
        <button class="q-step-btn" onclick="AssessmentApp.goToQuestion(3)" title="Question 4 (Problem)">4</button>
        <button class="q-step-btn" onclick="AssessmentApp.goToQuestion(4)" title="Question 5 (Problem)">5</button>
      </div>

      <!-- Navigation & Timer Actions -->
      <div class="nav-actions-group">
        <div class="timer-pill-badge" id="examTimerBadge" onclick="AssessmentApp.toggleTimer()" title="Click to start/reset 60s countdown timer">
          <i class="fa-regular fa-clock"></i>
          <span id="timerDisplay">01:00</span>
        </div>
        <button class="card-ctrl-btn" onclick="AssessmentApp.prevQuestion()" title="Previous Question (Left Arrow)">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <button class="card-ctrl-btn" onclick="AssessmentApp.nextQuestion()" title="Next Question (Right Arrow)">
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </header>

    <!-- =========================================================================
         ACTIVE QUESTION CARD (MATCHING APPROVED REFERENCE DESIGN)
         ========================================================================= -->
    <section class="nb-question-card" id="activeQuestionCard">
      <!-- Card Top Bar: Pill Tag & Control Icons -->
      <div class="card-top-bar">
        <div class="card-pill-tag" id="cardPillTag">
          <i class="fa-solid fa-pencil"></i>
          <span id="cardPillText">Question 1 • Proportion Solving</span>
        </div>

        <div class="card-controls-group">
          <button class="card-ctrl-btn" onclick="AssessmentApp.prevQuestion()" title="Previous Question">
            <i class="fa-solid fa-arrow-up"></i>
          </button>
          <button class="card-ctrl-btn" onclick="AssessmentApp.nextQuestion()" title="Next Question">
            <i class="fa-solid fa-arrow-down"></i>
          </button>
          <button class="card-ctrl-btn" onclick="AssessmentApp.cycleGroup()" title="Switch Next Group (A -> B -> C)">
            <i class="fa-solid fa-repeat"></i>
          </button>
          <button class="card-ctrl-btn" onclick="AssessmentApp.resetCurrentQuestion()" title="Reset Current Answer & Timer">
            <i class="fa-solid fa-rotate-right"></i>
          </button>
          <button class="card-ctrl-btn" onclick="AssessmentApp.clearCurrentScratchpad()" title="Clear Scratchpad Drawing">
            <i class="fa-solid fa-trash-can"></i>
          </button>
          <button class="card-ctrl-btn" onclick="AssessmentApp.exportCurrentCardImage()" title="حفظ بطاقة المسألة كصورة (Camera)">
            <i class="fa-solid fa-camera"></i>
          </button>
        </div>
      </div>

      <!-- Question Prompt & LaTeX Formula Area -->
      <div class="question-prompt-container">
        <span class="question-category-label" id="questionCategoryLabel">First: Choose the correct answer:</span>
        <h2 class="question-statement-text" id="questionStatementText">
          جاري تحميل السؤال...
        </h2>
      </div>

      <!-- MCQ Options Grid (Visible for Choose Questions) -->
      <div class="mcq-options-wrapper" id="mcqOptionsWrapper">
        <!-- Rendered dynamically via JavaScript -->
      </div>

      <!-- =======================================================================
           RULED NOTEBOOK CANVAS (NOTEBOOK SCRATCHPAD & DERIVATION)
           ======================================================================= -->
      <div class="notebook-canvas-container" id="notebookCanvasBox">
        <!-- Ruled Horizontal Paper Lines -->
        <div class="ruled-notebook-paper" id="notebookPaperWrapper">
          <canvas id="notebook-canvas"></canvas>
        </div>

        <!-- Inline Stylus Toolbar (Under Scratchpad) -->
        <div class="nb-inline-toolbar" id="nbInlineToolbar">
          <div class="nb-tools-left">
            <!-- Palette Color Dots -->
            <div class="color-dot-picker">
              <div class="nb-color-dot active" style="background:#182038;" onclick="AssessmentApp.setPenColor('#182038', this)" title="Navy / Black"></div>
              <div class="nb-color-dot" style="background:#6c5ce7;" onclick="AssessmentApp.setPenColor('#6c5ce7', this)" title="Purple"></div>
              <div class="nb-color-dot" style="background:#eb4d4b;" onclick="AssessmentApp.setPenColor('#eb4d4b', this)" title="Red"></div>
              <div class="nb-color-dot" style="background:#00b894;" onclick="AssessmentApp.setPenColor('#00b894', this)" title="Teal"></div>
              <div class="nb-color-dot" style="background:#fdcb6e;" onclick="AssessmentApp.setPenColor('#fdcb6e', this)" title="Amber"></div>
            </div>

            <div class="nb-toolbar-divider"></div>

            <!-- Stroke Width -->
            <select class="nb-stroke-select" id="nbStrokeSelect" onchange="AssessmentApp.setPenWidth(this.value)">
              <option value="2">2px</option>
              <option value="4" selected>4px</option>
              <option value="6">6px</option>
              <option value="10">10px</option>
            </select>

            <div class="nb-toolbar-divider"></div>

            <!-- Pen & Eraser Tools -->
            <button class="nb-tool-btn active" id="nbToolPenBtn" onclick="AssessmentApp.setTool('pen', this)" title="Pen Tool">
              <i class="fa-solid fa-pen"></i>
            </button>
            <button class="nb-tool-btn" id="nbToolEraserBtn" onclick="AssessmentApp.toggleEraser(this)" title="Eraser Tool">
              <i class="fa-solid fa-eraser"></i>
            </button>

            <div class="nb-toolbar-divider"></div>

            <!-- Undo / Redo / Clear -->
            <button class="nb-tool-btn" onclick="AssessmentApp.undoCurrentCanvas()" title="Undo Last Stroke">
              <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button class="nb-tool-btn" onclick="AssessmentApp.redoCurrentCanvas()" title="Redo Stroke">
              <i class="fa-solid fa-rotate-right"></i>
            </button>
            <button class="nb-tool-btn" onclick="AssessmentApp.clearCurrentScratchpad()" title="Clear Canvas">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>

          <div class="nb-tools-right">
            <!-- Expand & Shrink Canvas Height -->
            <button class="canvas-resize-btn" onclick="AssessmentApp.adjustCanvasHeight(60)" title="Increase Canvas Height (+60px)">
              <i class="fa-solid fa-plus"></i>
            </button>
            <button class="canvas-resize-btn" onclick="AssessmentApp.adjustCanvasHeight(-60)" title="Decrease Canvas Height (-60px)">
              <i class="fa-solid fa-minus"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- =======================================================================
           MODEL SOLUTION DRAWER (ACCORDION REVEAL)
           ======================================================================= -->
      <div class="card-bottom-actions">
        <button class="btn-show-model-solution" id="btnToggleModelSolution" onclick="AssessmentApp.toggleModelSolution()">
          <i class="fa-solid fa-eye"></i>
          <span>Show Model Solution</span>
        </button>

        <div class="model-solution-content" id="modelSolutionContent">
          <!-- Dynamically populated with step-by-step KaTeX math -->
        </div>
      </div>
    </section>

  </main>

  <!-- =========================================================================
       FULL-SCREEN IPAD SCREEN PEN MODE OVERLAY
       ========================================================================= -->
  <div class="fullscreen-pen-overlay" id="fullscreenPenOverlay">
    <canvas id="fullscreenPenCanvas" class="fullscreen-pen-canvas"></canvas>

    <!-- Floating Stylus Dock -->
    <div class="floating-stylus-dock">
      <div class="toolbar-group">
        <div class="color-dot active" style="background:#6c5ce7;" onclick="setFsPenColor('#6c5ce7', this)" title="Purple"></div>
        <div class="color-dot" style="background:#eb4d4b;" onclick="setFsPenColor('#eb4d4b', this)" title="Red"></div>
        <div class="color-dot" style="background:#00b894;" onclick="setFsPenColor('#00b894', this)" title="Green"></div>
        <div class="color-dot" style="background:#182038;" onclick="setFsPenColor('#182038', this)" title="Navy"></div>
        <div class="color-dot" style="background:#fdcb6e;" onclick="setFsPenColor('#fdcb6e', this)" title="Yellow"></div>
      </div>

      <div class="toolbar-group">
        <button class="tool-btn active" id="btnFsToolPen" onclick="setFsTool('pen', this)" title="Freehand Pen">
          <i class="fa-solid fa-pen"></i>
        </button>
        <button class="tool-btn" id="btnFsToolLine" onclick="setFsTool('line', this)" title="Straight Line">
          <i class="fa-solid fa-ruler"></i>
        </button>
        <button class="tool-btn" id="btnFsToolRect" onclick="setFsTool('rect', this)" title="Rectangle / Box">
          <i class="fa-regular fa-square"></i>
        </button>
        <button class="tool-btn" id="btnFsToolCircle" onclick="setFsTool('circle', this)" title="Circle">
          <i class="fa-regular fa-circle"></i>
        </button>
        <button class="tool-btn" id="btnFsToolAxis" onclick="setFsTool('axis', this)" title="Coordinate Axes">
          <i class="fa-solid fa-chart-line"></i>
        </button>
      </div>

      <div class="toolbar-group">
        <select class="stroke-select" onchange="setFsPenWidth(this.value)" title="Stroke Width">
          <option value="3">3px</option>
          <option value="6" selected>6px</option>
          <option value="12">12px</option>
        </select>

        <button class="tool-btn" id="btnFsEraser" onclick="toggleFsEraser()" title="Eraser">
          <i class="fa-solid fa-eraser"></i>
        </button>

        <button class="tool-btn btn-undo" id="btnFsUndo" onclick="undoFsCanvas()" title="Undo last stroke">
          <i class="fa-solid fa-rotate-left"></i>
        </button>

        <button class="tool-btn btn-export-board" onclick="exportFsCanvasImage()" title="Save Board as PNG">
          <i class="fa-solid fa-camera"></i>
        </button>

        <button class="tool-btn stylus-indicator active" onclick="toggleStylusMode(this)" title="Stylus Only (Palm Rejection Active)">
          <i class="fa-solid fa-pen-nib"></i>
        </button>

        <button class="tool-btn" onclick="clearFsCanvas()" title="Clear screen">
          <i class="fa-solid fa-trash-can"></i>
        </button>

        <button class="tool-btn btn-fs-exit" id="btnFsExit" onclick="exitFsPenMode()" title="Exit Screen Writing">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- =========================================================================
       INFINITE CANVAS WHITEBOARD OVERLAY
       ========================================================================= -->
  <div class="infinite-whiteboard-overlay" id="infiniteWhiteboardOverlay">
    <canvas id="infiniteWhiteboardCanvas" class="infinite-whiteboard-canvas"></canvas>

    <!-- Floating Image Toolbar -->
    <div class="wb-image-toolbar" id="wbImageToolbar" style="display: none;">
      <span class="wb-img-tb-label"><i class="fa-solid fa-image"></i> Image</span>
      <button class="wb-img-tb-btn" onclick="InfiniteWhiteboard.scaleSelectedImage(1.15)" title="Enlarge (+15%)">
        <i class="fa-solid fa-magnifying-glass-plus"></i>
      </button>
      <button class="wb-img-tb-btn" onclick="InfiniteWhiteboard.scaleSelectedImage(0.85)" title="Shrink (-15%)">
        <i class="fa-solid fa-magnifying-glass-minus"></i>
      </button>
      <button class="wb-img-tb-btn" onclick="InfiniteWhiteboard.centerSelectedImage()" title="Center in View">
        <i class="fa-solid fa-crosshairs"></i>
      </button>
      <button class="wb-img-tb-btn wb-img-tb-danger" onclick="InfiniteWhiteboard.deleteSelectedImage()" title="Delete Image">
        <i class="fa-solid fa-trash-can"></i>
      </button>
      <button class="wb-img-tb-btn wb-img-tb-done" onclick="InfiniteWhiteboard.deselectImage()" title="Done (Lock Image)">
        <i class="fa-solid fa-check"></i>
      </button>
    </div>

    <!-- Main Floating Bottom Control Dock -->
    <div class="wb-floating-dock" id="wbFloatingDock">
      <button class="wb-dock-btn wb-btn-danger-soft" onclick="InfiniteWhiteboard.close()" title="Exit Whiteboard (Esc)">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <button class="wb-dock-btn" id="wbThemeToggleBtn" onclick="InfiniteWhiteboard.cycleGrid()" title="Toggle Light / Dark Board">
        <i class="fa-solid fa-circle-half-stroke" id="wbThemeIcon"></i>
      </button>
      <button class="wb-dock-btn" id="wbPatternToggleBtn" onclick="InfiniteWhiteboard.cyclePattern()" title="Background: Solid / Grid / Lines">
        <i class="fa-solid fa-border-none" id="wbPatternIcon"></i>
      </button>

      <div class="wb-dock-divider"></div>

      <!-- Color Palette -->
      <div class="wb-color-group" id="wbColorGroup">
        <button class="wb-color-circle active" id="wbColor1" onclick="InfiniteWhiteboard.setColor(this.dataset.color, this)" title="Color 1"></button>
        <button class="wb-color-circle" id="wbColor2" onclick="InfiniteWhiteboard.setColor(this.dataset.color, this)" title="Color 2"></button>
        <button class="wb-color-circle" id="wbColor3" onclick="InfiniteWhiteboard.setColor(this.dataset.color, this)" title="Color 3"></button>
        <button class="wb-color-circle" id="wbColor4" onclick="InfiniteWhiteboard.setColor(this.dataset.color, this)" title="Color 4"></button>
      </div>

      <div class="wb-dock-divider"></div>

      <!-- Stroke Widths -->
      <div class="wb-stroke-group">
        <button class="wb-stroke-btn" onclick="InfiniteWhiteboard.stepWidth(-2)" title="Decrease Pen Size (-)">
          <i class="fa-solid fa-minus" style="font-size:0.65rem;"></i>
        </button>
        <button class="wb-stroke-btn" data-width="3" onclick="InfiniteWhiteboard.setWidth(3, this)" title="Fine (3px)">
          <span style="width:4px; height:4px; border-radius:50%; background:currentColor; display:inline-block;"></span>
        </button>
        <button class="wb-stroke-btn active" data-width="6" onclick="InfiniteWhiteboard.setWidth(6, this)" title="Medium (6px)">
          <span style="width:7px; height:7px; border-radius:50%; background:currentColor; display:inline-block;"></span>
        </button>
        <button class="wb-stroke-btn" data-width="12" onclick="InfiniteWhiteboard.setWidth(12, this)" title="Bold (12px)">
          <span style="width:11px; height:11px; border-radius:50%; background:currentColor; display:inline-block;"></span>
        </button>
        <button class="wb-stroke-btn" onclick="InfiniteWhiteboard.stepWidth(2)" title="Increase Pen Size (+)">
          <i class="fa-solid fa-plus" style="font-size:0.65rem;"></i>
        </button>
      </div>

      <div class="wb-dock-divider"></div>

      <!-- Tools -->
      <button class="wb-dock-btn active" id="wbToolPen" onclick="InfiniteWhiteboard.setTool('pen', this)" title="Pen (P)">
        <i class="fa-solid fa-pen"></i>
      </button>
      <button class="wb-dock-btn" id="wbToolEraser" onclick="InfiniteWhiteboard.setTool('eraser', this)" title="Eraser (E)">
        <i class="fa-solid fa-eraser"></i>
      </button>

      <!-- Shapes Dropdown -->
      <div class="wb-dropdown-wrap">
        <button class="wb-dock-btn wb-dropdown-trigger" id="wbShapesTrigger" onclick="InfiniteWhiteboard.toggleShapesPopover(event)" title="Geometric Tools & Shapes">
          <i class="fa-solid fa-shapes" id="wbActiveShapeIcon"></i>
          <i class="fa-solid fa-caret-down wb-dropdown-caret"></i>
        </button>
        <div class="wb-popover-menu wb-shapes-popover" id="wbShapesPopover">
          <button class="wb-popover-btn" id="wbToolLine" onclick="InfiniteWhiteboard.setTool('line', this)" title="Straight Line (L)">
            <i class="fa-solid fa-ruler"></i>
          </button>
          <button class="wb-popover-btn" id="wbToolRect" onclick="InfiniteWhiteboard.setTool('rect', this)" title="Rectangle / Box (R)">
            <i class="fa-regular fa-square"></i>
          </button>
          <button class="wb-popover-btn" id="wbToolCircle" onclick="InfiniteWhiteboard.setTool('circle', this)" title="Circle (C)">
            <i class="fa-regular fa-circle"></i>
          </button>
          <button class="wb-popover-btn" id="wbToolAxis" onclick="InfiniteWhiteboard.setTool('axis', this)" title="Coordinate Axes (A)">
            <i class="fa-solid fa-chart-line"></i>
          </button>
          <button class="wb-popover-btn" id="wbToolSelect" onclick="InfiniteWhiteboard.setTool('select', this)" title="Select Image (V)">
            <i class="fa-solid fa-arrow-pointer"></i>
          </button>
        </div>
      </div>

      <!-- Image Import -->
      <button class="wb-dock-btn" id="wbToolImageUpload" onclick="InfiniteWhiteboard.triggerImageUpload()" title="Insert Image onto Whiteboard">
        <i class="fa-solid fa-image"></i>
      </button>
      <input type="file" id="wbImageFileInput" accept="image/*" style="display:none;" onchange="InfiniteWhiteboard.handleImageUpload(event)">

      <div class="wb-dock-divider"></div>

      <!-- Undo / Redo / Clear -->
      <button class="wb-dock-btn" onclick="InfiniteWhiteboard.undo()" title="Undo (Ctrl+Z)">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
      <button class="wb-dock-btn" onclick="InfiniteWhiteboard.redo()" title="Redo (Ctrl+Y)">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
      <button class="wb-dock-btn wb-btn-danger" onclick="InfiniteWhiteboard.clear()" title="Clear Whiteboard">
        <i class="fa-solid fa-trash-can"></i>
      </button>

      <div class="wb-dock-divider"></div>

      <!-- Zoom & Export -->
      <button class="wb-dock-btn" onclick="InfiniteWhiteboard.zoomOut()" title="Zoom Out (Ctrl -)">
        <i class="fa-solid fa-magnifying-glass-minus"></i>
      </button>
      <span class="wb-zoom-badge" id="wbZoomDisplay" onclick="InfiniteWhiteboard.resetView()" title="Reset View (100%)">100%</span>
      <button class="wb-dock-btn" onclick="InfiniteWhiteboard.zoomIn()" title="Zoom In (Ctrl +)">
        <i class="fa-solid fa-magnifying-glass-plus"></i>
      </button>
      <button class="wb-dock-btn" onclick="InfiniteWhiteboard.exportPNG()" title="Export PNG Image">
        <i class="fa-solid fa-camera"></i>
      </button>
    </div>
  </div>

  <!-- FLOATING ACTION BUTTONS (STUDIO, WHITEBOARD, SCREEN PEN) -->
  <!-- Floating Studio Mode Action Button (Top of vertical stack: bottom 120px) -->
  <button id="floatingStudioModeFab" class="floating-studio-fab" onclick="toggleStudioMode()" title="Studio Mode (وضع الاستوديو للشرح والتسجيل)">
    <i class="fa-solid fa-video"></i>
  </button>

  <!-- Floating Whiteboard Action Button (Middle of vertical stack: bottom 70px) -->
  <button id="floatingWhiteboardFab" class="floating-whiteboard-fab" onclick="InfiniteWhiteboard.open()" title="السبورة اللانهائية (Infinite Whiteboard)">
    <i class="fa-solid fa-infinity"></i>
  </button>

  <!-- Floating Screen Pen Action Button (Bottom of vertical stack: bottom 20px) -->
  <button id="floatingScreenPenFab" class="floating-screen-pen-fab" onclick="FullScreenPen.toggle()" title="الكتابة على الشاشة (Screen Pen)">
    <i class="fa-solid fa-pen-nib"></i>
  </button>

  <!-- Floating Studio Mode Exit Button (Visible only in studio mode) -->
  <button class="exit-studio-btn" id="exitStudioBtn" onclick="toggleStudioMode()" title="خروج من وضع الاستوديو (Exit Studio)" style="display: none;">
    <i class="fa-solid fa-arrow-right-from-bracket"></i>
  </button>

  <!-- Core Scripts -->
  <script src="assessment_data.js"></script>
  <script src="drawing_engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
